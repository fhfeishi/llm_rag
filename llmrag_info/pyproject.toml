[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "llmrag"
version = "0.1.0"
description = "LLM-native RAG over structured file trees."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "litellm>=1.83.7",
  "pydantic>=2.0",
  "PyPDF2>=3.0.1",
  "python-pptx>=1.0.0",
  "openpyxl>=3.1.0",
]

[project.optional-dependencies]
server = [
  "fastapi>=0.115.0",
  "uvicorn>=0.30.0",
  "python-multipart>=0.0.9",
]

[project.scripts]
llmrag = "llmrag.cli:main"

[tool.setuptools.package-dir]
"" = ".."

[tool.setuptools.packages.find]
where = [".."]
include = ["llmrag*"]
